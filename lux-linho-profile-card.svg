<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Lux Linho — Physics × Computation</title>
  <desc id="desc">A modern editorial profile card with modular violet, lime, and orange accents.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#121212" flood-opacity=".10"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
      .micro { font-size: 11px; font-weight: 650; letter-spacing: 1.4px; }
      .link { font-size: 13px; font-weight: 750; letter-spacing: 1px; }
      .float-a { animation: floatA 6s ease-in-out infinite; }
      .float-b { animation: floatB 7s ease-in-out infinite; }
      .arrow { transform-origin: 1063px 78px; animation: turn 9s ease-in-out infinite; }
      @keyframes floatA { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @keyframes floatB { 0%,100% { transform: translateY(0) } 50% { transform: translateY(4px) } }
      @keyframes turn { 0%,82%,100% { transform: rotate(0deg) } 91% { transform: rotate(45deg) } }
      @media (prefers-reduced-motion: reduce) {
        .float-a,.float-b,.arrow { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="440" rx="32" fill="#F4F4F2"/>
  <rect x="18" y="18" width="1164" height="404" rx="26" fill="#FFFFFF" stroke="#161616" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- identity -->
  <text class="sans" x="66" y="111" fill="#111111" font-size="76" font-weight="900" letter-spacing="-4">LUX</text>
  <text class="sans" x="66" y="181" fill="#111111" font-size="76" font-weight="900" letter-spacing="-4">LINHO</text>
  <text class="mono label" x="72" y="218" fill="#111111">PHYSICS × COMPUTATION</text>

  <path d="M66 248H430" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="66" y="284" fill="#111111" font-size="20" font-weight="500">Exploring physical systems through</text>
  <text class="sans" x="66" y="312" fill="#111111" font-size="20" font-weight="750">data, models, and code.</text>

  <!-- upper module -->
  <g class="float-b">
    <rect x="744" y="48" width="268" height="94" rx="22" fill="#B56BEA"/>
    <text class="mono micro" x="770" y="78" fill="#FFFFFF">FIELD 01</text>
    <text class="sans" x="770" y="112" fill="#FFFFFF" font-size="21" font-weight="800" letter-spacing="-.4">PHYSICAL SYSTEMS</text>
  </g>

  <circle cx="1063" cy="78" r="28" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <g class="arrow">
    <path d="M1053 88L1073 68M1058 68H1073V83" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="mono micro" x="1097" y="76" fill="#111111">PERSON</text>
  <text class="mono" x="1097" y="94" fill="#111111" font-size="10" font-weight="650" letter-spacing=".9">INDEX / 26</text>

  <!-- modular tiles -->
  <g class="float-a">
    <rect x="498" y="174" width="196" height="116" rx="22" fill="#111111"/>
    <text class="mono micro" x="522" y="203" fill="#FFFFFF">QUESTION</text>
    <text class="sans" x="522" y="244" fill="#FFFFFF" font-size="27" font-weight="800">MATTER</text>
    <path d="M645 249L668 226M650 226H668V244" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float-b">
    <rect x="711" y="174" width="214" height="116" rx="22" fill="#C7F54B"/>
    <text class="mono micro" x="735" y="203" fill="#111111">FRAME</text>
    <text class="sans" x="735" y="244" fill="#111111" font-size="24" font-weight="850" letter-spacing="-.5">SPACETIME</text>
    <circle cx="893" cy="260" r="13" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="893" cy="260" r="3.5" fill="#111111"/>
  </g>

  <g class="float-a">
    <rect x="942" y="174" width="192" height="116" rx="22" fill="#FF6B1A"/>
    <text class="mono micro" x="966" y="203" fill="#FFFFFF">METHOD</text>
    <text class="sans" x="966" y="232" fill="#FFFFFF" font-size="20" font-weight="800">OBSERVE</text>
    <text class="sans" x="966" y="258" fill="#FFFFFF" font-size="20" font-weight="800">MODEL / BUILD</text>
  </g>

  <!-- footer index -->
  <rect x="498" y="320" width="636" height="62" rx="19" fill="#F0F0EE" stroke="#DADAD6"/>
  <circle cx="530" cy="351" r="13" fill="#B56BEA"/>
  <text class="mono link" x="558" y="356" fill="#111111">GITHUB</text>
  <circle cx="665" cy="351" r="13" fill="#C7F54B"/>
  <text class="mono link" x="693" y="356" fill="#111111">WEBSITE</text>
  <circle cx="816" cy="351" r="13" fill="#FF6B1A"/>
  <text class="mono link" x="844" y="356" fill="#111111">LINKEDIN</text>
  <text class="mono micro" x="1048" y="355" fill="#111111">↗ 2026</text>

  <text class="mono micro" x="66" y="384" fill="#777773">INDEPENDENT RESEARCH / OPEN WORK</text>
</svg>
